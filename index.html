<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARSKEY TRANSFORMASI AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            background-image: 
                radial-gradient(at 0% 0%, rgba(17, 24, 39, 1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(13, 20, 35, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(17, 24, 39, 1) 0, transparent 50%);
            background-attachment: fixed;
            color: #e5e7eb;
        }

        .font-display { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.05);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            outline: none;
        }

        .btn-glow {
            background: linear-gradient(90deg, #0284c7, #0ea5e9);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            transform: scale(0);
            transition: transform 0.5s ease-out;
            z-index: -1;
        }

        .btn-glow:hover::before {
            transform: scale(1);
        }

        .text-gradient {
            background: linear-gradient(to right, #38bdf8, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        option {
            background-color: #0f172a;
            color: #e5e7eb;
            font-weight: 600;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0284c7; }
        
        #errorToast {
            transform: translateY(-200%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #errorToast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8">

    <div id="errorToast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-red-600/90 text-white px-6 py-4 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] font-bold flex items-center gap-3 backdrop-blur-md z-[100]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        <span id="errorMsg">Harap pilih Preset Konsep & Gaya terlebih dahulu!</span>
    </div>

    <header class="flex justify-between items-center mb-8 glass-panel rounded-2xl p-4">
        <div class="flex items-center gap-4">
            <img src="https://i.imgur.com/ZmCmrVm.png" alt="Marskey Logo" class="h-14 drop-shadow-[0_0_15px_rgba(56,189,248,0.5)]" onerror="this.src='https://placehold.co/60x60/0f172a/38bdf8?text=M'">
            <div>
                <h1 class="text-3xl font-display font-bold text-gradient tracking-wider">MARSKEY</h1>
                <p class="text-sm font-semibold text-cyan-500 uppercase tracking-[0.2em] drop-shadow-md">Transformasi AI</p>
            </div>
        </div>
        <button onclick="repairUI()" title="Reset / Repair UI" class="flex items-center justify-center p-3 rounded-xl border border-red-500/30 text-red-400 hover:bg-red-500/10 hover:border-red-500 transition-all shadow-lg hover:shadow-red-500/25">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
        </button>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <div class="md:col-span-5 glass-panel rounded-2xl p-6 h-fit">
            
            <!-- Mode Skenario -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-cyan-400 mb-2">Mode Skenario</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="relative cursor-pointer">
                        <input type="radio" name="modeSkenario" value="standar" class="peer sr-only" checked onchange="toggleMode()">
                        <div class="p-3 text-center rounded-xl glass-input text-gray-400 peer-checked:text-cyan-300 peer-checked:border-cyan-400 peer-checked:bg-cyan-900/35 transition-all font-semibold text-xs">Standar Multi-Scene</div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="modeSkenario" value="guardian" class="peer sr-only" onchange="toggleMode()">
                        <div class="p-3 text-center rounded-xl glass-input text-gray-400 peer-checked:text-purple-300 peer-checked:border-purple-400 peer-checked:bg-purple-900/35 transition-all font-semibold text-xs">Guardian Particle-Fusion</div>
                    </label>
                </div>
            </div>

            <!-- Upload Grid Dinamis -->
            <div id="uploadGridContainer" class="grid grid-cols-2 gap-4 mb-6 transition-all duration-300">
                <!-- Subjek Utama -->
                <div class="relative aspect-square rounded-xl glass-input overflow-hidden group cursor-pointer flex flex-col items-center justify-center text-center p-2 border-dashed border-2 hover:border-cyan-400 transition-colors">
                    <input type="file" id="uploadKarakter" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewImage(this, 'previewKarakter', 'textKarakter')">
                    <img id="previewKarakter" class="absolute inset-0 w-full h-full object-cover opacity-0 z-10 transition-opacity duration-300">
                    <div id="textKarakter" class="relative z-0 text-cyan-500/70 group-hover:text-cyan-400 flex flex-col items-center group-hover:scale-105 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        <span class="text-[10px] font-semibold">Subjek Utama</span>
                    </div>
                </div>

                <!-- Subjek Pendamping (Hanya Guardian) -->
                <div id="boxPendamping" style="display: none;" class="relative aspect-square rounded-xl glass-input overflow-hidden group cursor-pointer flex flex-col items-center justify-center text-center p-2 border-dashed border-2 hover:border-purple-400 transition-colors">
                    <input type="file" id="uploadTambahan" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewImage(this, 'previewTambahan', 'textTambahanBox')">
                    <img id="previewTambahan" class="absolute inset-0 w-full h-full object-cover opacity-0 z-10 transition-opacity duration-300">
                    <div id="textTambahanBox" class="relative z-0 text-purple-400/70 group-hover:text-purple-300 flex flex-col items-center group-hover:scale-105 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span class="text-[10px] font-semibold">Subjek Pendamping</span>
                    </div>
                </div>

                <!-- Latar Belakang -->
                <div class="relative aspect-square rounded-xl glass-input overflow-hidden group cursor-pointer flex flex-col items-center justify-center text-center p-2 border-dashed border-2 hover:border-cyan-400 transition-colors">
                    <input type="file" id="uploadBackground" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewImage(this, 'previewBackground', 'textBackground')">
                    <img id="previewBackground" class="absolute inset-0 w-full h-full object-cover opacity-0 z-10 transition-opacity duration-300">
                    <div id="textBackground" class="relative z-0 text-cyan-500/70 group-hover:text-cyan-400 flex flex-col items-center group-hover:scale-105 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        <span class="text-[10px] font-semibold">Latar Belakang</span>
                    </div>
                </div>
            </div>

            <div class="space-y-5">
                
                <!-- GABUNGAN TEMA & GAYA -->
                <div>
                    <label class="block text-sm font-semibold text-cyan-400 mb-2">Pilih Preset Konsep & Gaya</label>
                    <select id="presetKombinasi" class="w-full p-3 rounded-xl glass-input text-gray-200 cursor-pointer appearance-none font-semibold mb-2" onchange="updatePresetData()">
                        <option value="" disabled selected>-- PILIH PRESET TRANSFORMASI --</option>
                        <option value="exosuit">Exosuit Tactical Mech (Military Plating)</option>
                        <option value="mecha">Mecha Gundam / Heavy Assault Mech</option>
                        <option value="ironman">Nano-Tech Merambat Cepat (Gaya Iron Man)</option>
                        <option value="national">National Pride Armor (Zirah Identitas Negara)</option>
                        <option value="symbiote">Bio-Organic / Alien Symbiote (Gaya Venom)</option>
                        <option value="celestial">Divine Celestial / Angelic Paladin</option>
                        <option value="ninja">Cyber Ninja / Shadow Assassin</option>
                        <option value="elemental">Elemental Titan (Magma/Es/Petir)</option>
                        <option value="samurai">Cybernetic Ronin / Samurai Futuristik</option>
                        <option value="madmax">Apocalyptic Scavenger / Mad Max</option>
                        <option value="steampunk">Steampunk Clockwork / Victorian Gear</option>
                        <option value="marine">Galactic Space Marine / Star Commando</option>
                        <option value="crystal">Crystal Quartz / Prism Shard Armor</option>
                    </select>
                    
                    <p id="deskripsiSingkat" class="text-[11px] text-cyan-200/70 italic leading-relaxed mb-3 hidden"></p>

                    <!-- Input Khusus Negara (Hanya muncul jika National Pride dipilih) -->
                    <div id="countryInputBox" class="hidden mb-3 relative z-40">
                        <label class="block text-xs font-bold text-yellow-400 mb-1">Nama Negara & Ornamen (Contoh: Indonesia, Garuda, Batik)</label>
                        <input type="text" id="countryName" placeholder="Ketik negara / budaya..." class="w-full p-3 rounded-xl glass-input text-yellow-300 border-yellow-500/50 focus:border-yellow-400 font-semibold" oninput="updateDynamicPrompt()">
                    </div>

                    <!-- Input Khusus Iron Man Varian -->
                    <div id="ironmanOptionsBox" class="hidden mb-3 relative z-50">
                        <label class="block text-xs font-bold text-red-400 mb-1">Varian Zirah (Khusus Nano-Tech)</label>
                        <select id="ironmanSuit" class="w-full p-3 rounded-xl glass-input text-red-300 border-red-500/50 focus:border-red-400 focus:ring-1 focus:ring-red-400 font-semibold text-sm cursor-pointer" onchange="updateDynamicPrompt()">
                            <option value="Sleek vibrant red and silver metallic nano-tech armor with glowing red circular platform">Custom Video (Perak Merah Sleek & Platform Menyala)</option>
                            <option value="Classic Red and Gold Mark 85 style armor">Mark 85 (Klasik Merah Emas)</option>
                            <option value="Sleek Silver and Red Centurion style armor">Silver Centurion (Perak Merah Klasik)</option>
                            <option value="Heavy militaristic Gunmetal Grey and Black armor with shoulder cannons">War Machine (Gunmetal & Hitam)</option>
                            <option value="Massive, oversized, bulky Hulkbuster style heavy armor">Hulkbuster (Super Masif Bulky)</option>
                            <option value="Matte Black stealth armor with glowing blue neon accents">Stealth Suit (Hitam Matte Cahaya Biru)</option>
                            <option value="Dark Emerald and Gold metallic nano-tech armor with intricate dragon scale textures" class="text-green-400">Dragon Buster (Hijau Zamrud & Emas Bersisik)</option>
                            <option value="Toxic Matte Black stealth armor with glowing neon green accents and bio-luminescent lines" class="text-green-400">Toxic Stealth (Hitam Matte & Neon Hijau)</option>
                        </select>
                    </div>

                    <textarea id="textArahan" rows="5" placeholder="Skrip otomatis akan muncul di sini setelah Anda memilih preset..." class="w-full p-3 rounded-xl glass-input text-gray-200 placeholder-gray-600 resize-none text-sm transition-all duration-300"></textarea>
                </div>
            </div>

            <!-- Opsi Tambahan Khusus Guardian -->
            <div id="guardianOptions" class="hidden mb-6 bg-purple-900/20 border border-purple-500/30 p-4 rounded-xl transition-all duration-300 relative z-30">
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <input type="checkbox" id="addonWings" class="peer sr-only">
                        <div class="w-10 h-6 bg-gray-700/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-300 after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-500 peer-checked:after:bg-white"></div>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-purple-300 group-hover:text-purple-200 transition-colors font-display tracking-wide">Epic Fusion: Corak Hewan & Sayap Baja</span>
                        <span class="text-[10px] text-purple-400/70 mt-0.5">Zirah otomatis diukir corak sisik pendamping dan sayap mekanik terbuka di detik akhir.</span>
                    </div>
                </label>
            </div>

            <div class="space-y-5">
                
                <!-- GABUNGAN TEMA & GAYA -->
                <div>
                    <label class="block text-sm font-semibold text-cyan-400 mb-2">Rasio Video</label>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rasio" value="9:16" class="peer sr-only" checked>
                            <div class="p-2 text-center rounded-lg glass-input text-gray-400 peer-checked:text-cyan-300 peer-checked:border-cyan-400 peer-checked:bg-cyan-900/30 transition-all font-mono text-sm">9:16</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rasio" value="16:9" class="peer sr-only">
                            <div class="p-2 text-center rounded-lg glass-input text-gray-400 peer-checked:text-cyan-300 peer-checked:border-cyan-400 peer-checked:bg-cyan-900/30 transition-all font-mono text-sm">16:9</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rasio" value="3:4" class="peer sr-only">
                            <div class="p-2 text-center rounded-lg glass-input text-gray-400 peer-checked:text-cyan-300 peer-checked:border-cyan-400 peer-checked:bg-cyan-900/30 transition-all font-mono text-sm">3:4</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="rasio" value="1:1" class="peer sr-only">
                            <div class="p-2 text-center rounded-lg glass-input text-gray-400 peer-checked:text-cyan-300 peer-checked:border-cyan-400 peer-checked:bg-cyan-900/30 transition-all font-mono text-sm">1:1</div>
                        </label>
                    </div>
                </div>

                <!-- Durasi & Scene -->
                <div>
                    <label class="block text-sm font-semibold text-cyan-400 mb-2">Durasi & Scene Split</label>
                    <select id="durasi" class="w-full p-3 rounded-xl glass-input text-gray-200 cursor-pointer appearance-none">
                        <option value="1|5">1 Scene / 5 Detik (Short Render)</option>
                        <option value="1|10" selected>1 Scene / 10 Detik (Standar)</option>
                        <option value="1|15">1 Scene / 15 Detik</option>
                        <option value="2|10">2 Scene Berantai / 10 Detik</option>
                        <option value="2|20">2 Scene Berantai / 20 Detik</option>
                        <option value="3|15">3 Scene Berantai / 15 Detik</option>
                        <option value="3|30">3 Scene Berantai / 30 Detik (Epic Edit)</option>
                    </select>
                </div>

                <button id="generateBtn" onclick="generatePrompt()" class="w-full btn-glow text-white font-bold py-4 px-6 rounded-xl shadow-lg transition duration-300 font-display tracking-widest text-lg mt-4">
                    JADIKAN KARYAMU
                </button>
            </div>
        </div>

        <div class="md:col-span-7 glass-panel rounded-2xl p-6 relative flex flex-col">
            <h2 id="outputTitle" class="text-xl font-display font-bold text-cyan-400 mb-4 border-b border-cyan-500/20 pb-2">Unified Master Script</h2>
            <div id="outputContainer" class="flex-grow overflow-y-auto space-y-4 pb-4">
                <div class="h-full flex items-center justify-center text-gray-600 flex-col gap-3 opacity-50 min-h-[350px]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" /></svg>
                    <p class="font-display tracking-wider">PROMPT AKAN MUNCUL DI SINI</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const presets = {
            exosuit: {
                desc: "Konsep perakitan militer taktis dengan plat baja berat, piston hidrolik, dan helm tempur.",
                prompt: "Cinematic 8k footage, ultra-realistic VFX. Strict bottom-to-top mechanical assembly sequence. Heavy metallic greaves violently lock onto shins, pneumatic pistons and steel plating construct upwards, completely encasing thighs with ABSOLUTE FULL COVERAGE (OBLITERATE ALL BARE SKIN, zero shorts visible, zero skin visible). FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into heavy armored boots. Tactical chest cuirass snaps shut, heavy shoulder guards lock, arms lock in sequence, and a heavily armored tactical helmet seals the face perfectly."
            },
            mecha: {
                desc: "Zirah robot raksasa (Gundam style) berukuran masif dengan senjata mekanik dan lampu core.",
                prompt: "Cinematic 8k footage. Massive Mecha/Gundam style robotic transformation from the ground up. Giant mechanical boots lock on. Heavy steel robotic thigh armor assembles instantly covering ALL bare skin. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into giant robotic boots. Glowing energy core on the massive chest plate ignites. Robotic arms extend, heavy mechanical helmet locks over the head. Intricate gears and hydraulics visible."
            },
            ironman: {
                desc: "Nano-Tech Merambat Cepat dengan platform pijakan bercahaya merah.",
                prompt: "Cinematic 8k footage, ultra-realistic VFX. A character standing on high-tech glowing circular floor platforms emitting red light. Sleek, aerodynamic Nano-tech red and silver metallic suit rapidly spreading from the boots upwards. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into sleek armored boots. Micro-hexagonal plating constructs an absolute full lower body armor encasing thighs completely. ZERO BARE SKIN. High-tech chest arc reactor forms, motorized tight faceplate slams shut sealing the face."
            },
            national: {
                desc: "Zirah kebanggaan negara dengan ornamen budaya, bendera, dan platform bercahaya.",
                prompt: "Cinematic 8k footage, ultra-realistic VFX. A character standing on glowing technological floor platforms. Epic bottom-to-top mechanical assembly of a majestic National Pride cultural armor. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into heavy ornate armored boots. Ornate metallic greaves lock onto shins with cultural engravings, golden armor plating and battle skirts assemble over thighs covering all skin. A detailed chestplate featuring majestic national symbols and crests snaps into place. Fully sealed ceremonial helmet with a crest locks over the face."
            },
            symbiote: {
                desc: "Alien bio-organik (ala Venom) di mana cairan hitam merayap menutupi tubuh.",
                prompt: "Cinematic 8k bio-horror VFX. Alien organic symbiote biomass violently crawling from the feet upwards. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into organic clawed alien feet. Black living tendrils and wet organic muscle fibers completely wrap shins and thighs, forming an impenetrable living armor over the legs (ZERO BARE SKIN). The alien biomass consumes the torso, wrapping the arms, and finally encasing the head with a monstrous face, white jagged eyes, and sharp fangs."
            },
            celestial: {
                desc: "Zirah bernuansa malaikat/dewa dari lempengan emas murni dengan cahaya putih suci.",
                prompt: "8k divine fantasy VFX. Swirling pure white light and glowing halos forge solid heavy angelic paladin armor from the ground up. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into holy golden boots. Majestic golden plate armor completely covers thighs (ZERO BARE SKIN). Radiant glowing chestplate constructs, feathered wings of pure light erupt from the back, and a divine halo-crown helmet encloses the face flawlessly."
            },
            ninja: {
                desc: "Zirah ramping serat karbon hitam legam dengan garis neon dan efek asap ninja.",
                prompt: "8k dark sci-fi fantasy. Solidifying black smoke and shadow forming an impenetrable sleek stealth cyber-ninja armor from feet upwards. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into stealth cyber-tabi boots. Shadow-woven full pants and carbon-fiber plates covering thighs completely (ZERO BARE SKIN). Sleek glowing neon accents, cybernetic ninja mask fully enclosing the face."
            },
            elemental: {
                desc: "Elemen alam liar (es kristal, api vulkanik, atau petir) melebur jadi zirah titan.",
                prompt: "8k elemental magic VFX. Raw destructive elemental energy (swirling fire, cracking ice, and lightning) solidifies into thick heavy Titan armor from the ground up. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into boots made of solid elemental stone. Elemental plating completely encases thighs (ZERO BARE SKIN). A roaring elemental chestplate forms, and an elemental mask seals the face entirely."
            },
            samurai: {
                desc: "Ksatria samurai Jepang cybernetic dengan ornamen Oni, kabel optik, dan energi neon.",
                prompt: "Cinematic 8k. Cybernetic Ronin samurai transformation. High-tech traditional Japanese armor forms from the bottom up. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into armored cyber-sandals. Heavy layered thigh guards (Sode) assemble, leaving NO BARE SKIN. Intricate chest armor locks in, neon-glowing optical cables connect. A terrifying cybernetic Oni demon mask slams shut over the face."
            },
            madmax: {
                desc: "Zirah bertahan hidup pasca-apokaliptik terbuat dari rongsokan besi dan plat baja kasar.",
                prompt: "Cinematic 8k gritty post-apocalyptic VFX. Scrap metal, rusty steel plates, and scavenged car parts violently clamping together to form heavy Mad Max scavenger armor from the ground up. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into heavy steel-toed combat boots. Welded steel plates completely wrap the thighs (ZERO BARE SKIN). Heavy iron chest plate, exposed wires, and a gas-mask scavenger helmet enclosing the head."
            },
            steampunk: {
                desc: "Zirah retro-futuristik Victorian dengan roda gigi kuningan dan uap bertekanan tinggi.",
                prompt: "8k steampunk fantasy. High-pressure steam vents hissing as brass and copper mechanical clockwork armor assembles from the boots up. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into heavy brass steampunk boots. Interlocking gears and Victorian steel plating completely cover the thighs (ZERO BARE SKIN). Brass boiler chestplate ignites, mechanical arms lock, and a leather-and-brass goggle mask seals the face."
            },
            marine: {
                desc: "Zirah tempur ruang angkasa marinir galaksi yang sangat kokoh dengan lampu taktis.",
                prompt: "Cinematic 8k sci-fi. Heavy Galactic Space Marine combat suit assembly. Bulky aerospace-grade metal boots lock on. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into heavy lunar combat boots. Thick environmental sealing armor completely encases thighs and legs (ZERO BARE SKIN). Massive tactical chest plate with thrusters, heavy gauntlets, and a black-visored space commando helmet sealing perfectly."
            },
            crystal: {
                desc: "Pertumbuhan magis zirah tajam dari kristal kuarsa murni atau berlian prismatik.",
                prompt: "8k magical realism VFX. Sharp glowing crystalline structures growing organically from the ground up into heavy indestructible armor. FOOTWEAR OVERRIDE: Original shoes MUST instantly morph into jagged prism-crystal boots. Prism-greaves and full-length crystal plating locking over thighs seamlessly (ZERO BARE SKIN). Radiant diamond chestplate forms, and a faceted crystal helmet encloses the face flawlessly."
            }
        };

        function updatePresetData() {
            const presetKey = document.getElementById('presetKombinasi').value;
            const descEl = document.getElementById('deskripsiSingkat');
            const countryBox = document.getElementById('countryInputBox');
            const ironmanBox = document.getElementById('ironmanOptionsBox');
            
            if (presetKey && presets[presetKey]) {
                descEl.innerText = presets[presetKey].desc;
                descEl.classList.remove('hidden');

                if (presetKey === 'national') {
                    countryBox.classList.remove('hidden');
                    ironmanBox.classList.add('hidden');
                } else if (presetKey === 'ironman') {
                    ironmanBox.classList.remove('hidden');
                    countryBox.classList.add('hidden');
                } else {
                    countryBox.classList.add('hidden');
                    ironmanBox.classList.add('hidden');
                }
                
                updateDynamicPrompt();
            } else {
                descEl.classList.add('hidden');
                countryBox.classList.add('hidden');
                ironmanBox.classList.add('hidden');
                document.getElementById('textArahan').value = "";
            }
        }

        function updateDynamicPrompt() {
            const presetKey = document.getElementById('presetKombinasi').value;
            const textArea = document.getElementById('textArahan');
            
            if (presetKey && presets[presetKey]) {
                let basePrompt = presets[presetKey].prompt;

                if (presetKey === 'national') {
                    const countryVal = document.getElementById('countryName').value.trim();
                    if (countryVal) {
                        basePrompt += `\n\n[SPECIFIC NATIONAL THEME: Perfectly themed around ${countryVal.toUpperCase()}. Use highly accurate flag colors, national emblems, and authentic cultural engravings specific to ${countryVal} applied elegantly onto the armor.]`;
                    }
                }

                if (presetKey === 'ironman') {
                    const suitSelect = document.getElementById('ironmanSuit');
                    if (suitSelect) {
                        const suitType = suitSelect.value;
                        const suitText = suitSelect.options[suitSelect.selectedIndex].text;
                        
                        // Otomatis ubah aura & dasar warna jika pilih varian hijau/toxic
                        if (suitText.includes("Hijau") || suitText.includes("Neon Hijau")) {
                            basePrompt = basePrompt.replace("glowing circular floor platforms emitting red light", "glowing circular floor platforms emitting toxic emerald-green light");
                            basePrompt = basePrompt.replace("red and silver metallic suit", "dark green and black metallic suit");
                        }
                        
                        basePrompt += `\n\n[SPECIFIC ARMOR OVERRIDE: The armor formed MUST strictly be ${suitType}. Maintain the rapid nano-tech assembly sequence.]`;
                    }
                }

                textArea.value = basePrompt;
                
                // Efek visual kedip supaya tahu teksnya udah terupdate otomatis
                textArea.classList.add('border-cyan-400', 'bg-cyan-900/30', 'shadow-[0_0_15px_rgba(34,211,238,0.4)]');
                setTimeout(() => {
                    textArea.classList.remove('border-cyan-400', 'bg-cyan-900/30', 'shadow-[0_0_15px_rgba(34,211,238,0.4)]');
                }, 500);
            }
        }

        function toggleMode() {
            const mode = document.querySelector('input[name="modeSkenario"]:checked').value;
            const btn = document.getElementById('generateBtn');
            const title = document.getElementById('outputTitle');
            const gridContainer = document.getElementById('uploadGridContainer');
            const boxPendamping = document.getElementById('boxPendamping');
            const guardianOptions = document.getElementById('guardianOptions');

            if(mode === 'guardian') {
                btn.style.background = "linear-gradient(90deg, #7c3aed, #a855f7)";
                title.className = "text-xl font-display font-bold text-purple-400 mb-4 border-b border-purple-500/20 pb-2";
                title.innerText = "Guardian Particle-Fusion Script";
                
                if(boxPendamping) boxPendamping.style.display = "flex";
                if(guardianOptions) guardianOptions.classList.remove('hidden');
                if(gridContainer) {
                    gridContainer.classList.remove('grid-cols-2');
                    gridContainer.classList.add('grid-cols-3');
                }
            } else {
                btn.style.background = "linear-gradient(90deg, #0284c7, #0ea5e9)";
                title.className = "text-xl font-display font-bold text-cyan-400 mb-4 border-b border-cyan-500/20 pb-2";
                title.innerText = "Unified Master Script";
                
                if(boxPendamping) boxPendamping.style.display = "none";
                if(guardianOptions) guardianOptions.classList.add('hidden');
                if(gridContainer) {
                    gridContainer.classList.remove('grid-cols-3');
                    gridContainer.classList.add('grid-cols-2');
                }
            }
        }

        function previewImage(input, imgId, textId) {
            const img = document.getElementById(imgId);
            const textDiv = document.getElementById(textId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    img.classList.remove('opacity-0');
                    img.classList.add('opacity-100');
                    textDiv.classList.add('bg-black/70', 'p-1', 'rounded-md', 'backdrop-blur-sm'); 
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function showError(msg) {
            const toast = document.getElementById('errorToast');
            document.getElementById('errorMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function repairUI() {
            ['uploadKarakter', 'uploadTambahan', 'uploadBackground'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).value = "";
            });
            ['previewKarakter', 'previewTambahan', 'previewBackground'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.src = ""; el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }
            });
            ['textKarakter', 'textTambahanBox', 'textBackground'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).classList.remove('bg-black/70', 'p-1', 'rounded-md', 'backdrop-blur-sm');
            });
            
            document.getElementById('presetKombinasi').value = "";
            updatePresetData();

            document.getElementById('durasi').selectedIndex = 1;
            document.querySelector('input[name="rasio"][value="9:16"]').checked = true;
            document.querySelector('input[name="modeSkenario"][value="standar"]').checked = true;
            toggleMode();
            
            document.getElementById('outputContainer').innerHTML = `
                <div class="h-full flex items-center justify-center text-gray-600 flex-col gap-3 opacity-50 min-h-[350px]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" /></svg>
                    <p class="font-display tracking-wider">PROMPT AKAN MUNCUL DI SINI</p>
                </div>
            `;
        }

        function copyToClipboard(id) {
            const ta = document.getElementById(id);
            ta.select();
            document.execCommand("copy");
            
            const toast = document.createElement("div");
            toast.className = "fixed bottom-5 right-5 bg-cyan-500/90 text-white px-6 py-3 rounded-xl shadow-lg font-semibold transform transition-all duration-300 translate-y-0 opacity-100 flex items-center gap-2 backdrop-blur-sm z-50";
            toast.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Script Berhasil Disalin!`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add("translate-y-10", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function downloadText(id, filename) {
            const text = document.getElementById(id).value;
            const blob = new Blob([text], { type: "text/plain" });
            const anchor = document.createElement("a");
            anchor.download = filename + ".txt";
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
        }

        function generatePrompt() {
            const presetKey = document.getElementById('presetKombinasi').value;
            if (!presetKey) {
                showError("Harap pilih Preset Konsep & Gaya terlebih dahulu!");
                return;
            }

            const charFile = document.getElementById('uploadKarakter').files[0];
            const addFile = document.getElementById('uploadTambahan').files[0];
            const bgFile = document.getElementById('uploadBackground').files[0];
            
            const charName = charFile ? charFile.name : "Karakter_Utama_Ref.png";
            const addName = addFile ? addFile.name : "Companion_Animal_Ref.png";
            const bgName = bgFile ? bgFile.name : "Latar_Belakang_Ref.png";

            const btn = document.getElementById('generateBtn');
            btn.innerHTML = `MERACIK MASTER SCRIPT...`;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            setTimeout(() => {
                const presetSelect = document.getElementById('presetKombinasi');
                const presetJudul = presetSelect.options[presetSelect.selectedIndex].text;
                
                let userText = document.getElementById('textArahan').value;
                
                const ratio = document.querySelector('input[name="rasio"]:checked').value;
                const durasiVal = document.getElementById('durasi').value;
                const mode = document.querySelector('input[name="modeSkenario"]:checked').value;
                
                const [sceneCount, totalSeconds] = durasiVal.split('|').map(Number);
                const durationPerScene = totalSeconds / sceneCount;

                let containerHtml = `<div class="space-y-6 pb-4">`;
                let fullDownloadText = "";
                
                const addonWings = document.getElementById('addonWings') && document.getElementById('addonWings').checked;
                let wingText = addonWings ? " Intricate organic animal-scale patterns and glowing bio-luminescent lines permanently imprint and etch onto the metallic armor plates. In the final stage as the helmet locks into place, a pair of massive, majestic mechanical steel wings with razor-sharp metallic feathers majestically unfurl and extend from the back, glowing with internal energy." : "";
                let dissolveText = "gracefully dissolves into glowing energy particles and swirling bio-luminescent mist. The companion's body slowly transforms over several seconds, remaining visible as a fading ethereal energy silhouette in the background as the particles flow into the character's body.";

                for (let i = 1; i <= sceneCount; i++) {
                    let startT = (i - 1) * durationPerScene;
                    let endT = i * durationPerScene;
                    let stageDesc = "";
                    let continuityNote = i > 1 ? `\n[CONTINUITY NOTE: Maintain exact ending visual state from Scene ${i-1} as the starting frame. Seamlessly continue the sequence.]` : "";
                    
                    if (mode === 'guardian') {
                        if (sceneCount === 1) {
                            stageDesc = `Full sequence (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Companion entity from (${addName}) ${dissolveText} The glowing animal energy particles wrap around the character, infusing their essence into the armor being built from the boots up.${wingText} OPACITY LOCK: Armor must form 100% solid instantly, NO ghosting.`;
                        } else {
                            if (i === 1) stageDesc = `Scene 1 (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Companion ${dissolveText} Boots and shin armor form solid instantly.`;
                            else if (i === 2) stageDesc = `Scene 2 (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Energy infuses into thighs, armor spreads with companion's thematic aura.${addonWings ? ' Organic animal-scale patterns imprint onto the armor plates.' : ''} OPACITY LOCK: 100% solid, NO ghosting.`;
                            else stageDesc = `Scene 3 (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Final assembly. Upper body and helmet seal with companion particle integration.${addonWings ? ' A pair of massive mechanical steel wings unfurl majestically from the back.' : ''}`;
                        }
                    } else {
                        if (sceneCount === 1) {
                            stageDesc = `Full sequence (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Strict bottom-to-top assembly. OPACITY LOCK: Armor must form 100% solid and attached instantly, NO flying plates, NO ghosting. Helmet seals in the final second.`;
                        } else if (sceneCount === 2) {
                            if (i === 1) stageDesc = `First half (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Boots and thigh armor assembly. OPACITY LOCK: 100% solid, NO ghosting.`;
                            else stageDesc = `Second half (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Upper body and helmet locking securely over head.`;
                        } else {
                            if (i === 1) stageDesc = `Scene 1 (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Ground activation, armored boots lock onto shins.`;
                            else if (i === 2) stageDesc = `Scene 2 (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Solid plating encases thighs. OPACITY LOCK: 100% solid, NO ghosting.`;
                            else stageDesc = `Scene 3 (${startT.toFixed(1)}s-${endT.toFixed(1)}s): Torso assembly and helmet sealing.`;
                        }
                    }

                    let unifiedText = mode === 'guardian' ? `==================================================
GUARDIAN PARTICLE-FUSION SCRIPT - SCENE ${i} (${startT.toFixed(1)}s - ${endT.toFixed(1)}s)
==================================================
Ref: ${charName}, ${addName}, ${bgName}
Style: ${presetJudul}
Ratio: ${ratio}
Mode: GUARDIAN PARTICLE-FUSION${continuityNote}

[ACTION & MECHANICS]
${userText}
${stageDesc}

[STRICT ENFORCEMENTS]
- FOOTWEAR OVERRIDE: Original shoes/sneakers MUST instantly morph into style-appropriate heavy armored boots.
- DYNAMIC POSTURE: The character's arms MUST move and flex dynamically during assembly. DO NOT let arms remain stiff and static at the sides.
[STRICT RULES]
- Strict Bottom-to-Top assembly.
- OPACITY LOCK: 100% solid and opaque armor plates. ZERO ghosting, ZERO semi-transparent flying plates.
- ABSOLUTE FULL COVERAGE: OBLITERATE ALL BARE SKIN ON LEGS. SEAMLESS ARMOR PANTS ENCASE THIGHS COMPLETELY. ZERO SHORTS OR SKIN VISIBLE. ZERO THIGH GAPS.
- CONTINUITY LOCK: ONCE ARMORED, STAY ARMORED. The lower body armor MUST NOT disappear or revert back to the original shorts/bare legs when the upper body is assembling.
- ZERO LOOSE HAIR VISIBLE: All hair must be magically tucked inside the sealing helmet.

[NEGATIVE PROMPT]
transparent armor, ghosting, opacity fade, semi-transparent plates, flying unattached armor, clothes reappearing, shorts reappearing, bare legs, exposed skin on thighs, gaps in armor, shoes staying normal, original footwear unchanged, sneaker, white shoes, casual footwear, companion surviving intact, low quality, cartoon, watermark, logo, changing facial identity, loose hair visible, stiff static arms.
==================================================` : `==================================================
UNIFIED MASTER SCRIPT - SCENE ${i} (${startT.toFixed(1)}s - ${endT.toFixed(1)}s)
==================================================
Ref: ${charName}, ${bgName}
Style: ${presetJudul}
Ratio: ${ratio}
Mode: STANDARD MULTI-SCENE${continuityNote}

[ACTION & MECHANICS]
${userText}
${stageDesc}

[STRICT ENFORCEMENTS]
- FOOTWEAR OVERRIDE: Original shoes/sneakers MUST instantly morph into style-appropriate heavy armored boots.
- DYNAMIC POSTURE: The character's arms MUST move and flex dynamically during assembly. DO NOT let arms remain stiff and static at the sides.
[STRICT RULES]
- Strict Bottom-to-Top assembly.
- OPACITY LOCK: 100% solid and opaque armor plates. ZERO ghosting, ZERO semi-transparent flying plates.
- ABSOLUTE FULL COVERAGE: OBLITERATE ALL BARE SKIN ON LEGS. SEAMLESS ARMOR PANTS ENCASE THIGHS COMPLETELY. ZERO SHORTS OR SKIN VISIBLE. ZERO THIGH GAPS.
- CONTINUITY LOCK: ONCE ARMORED, STAY ARMORED. The lower body armor MUST NOT disappear or revert back to the original shorts/bare legs when the upper body is assembling.
- ZERO LOOSE HAIR VISIBLE: All hair must be magically tucked inside the sealing helmet.

[NEGATIVE PROMPT]
transparent armor, ghosting, opacity fade, semi-transparent plates, flying unattached armor, clothes reappearing, shorts reappearing, bare legs, exposed skin on thighs, gaps in armor, shoes staying normal, original footwear unchanged, sneaker, white shoes, casual footwear, instant armor appearance, incorrect anatomy, low quality, cartoon, watermark, logo, changing facial identity, loose hair visible, stiff static arms.
==================================================`;

                    fullDownloadText += unifiedText + "\n\n";

                    containerHtml += `
                        <div class="glass-input rounded-xl p-4 relative flex flex-col ${mode === 'guardian' ? 'border-purple-500/40' : 'border-cyan-500/40'}">
                            <div class="flex justify-between items-center mb-4 border-b ${mode === 'guardian' ? 'border-purple-500/30' : 'border-cyan-500/30'} pb-3">
                                <h3 class="text-sm font-bold ${mode === 'guardian' ? 'text-purple-300' : 'text-cyan-300'} font-display flex items-center gap-2">
                                    PROMPT SCENE ${i} (${startT.toFixed(1)}s - ${endT.toFixed(1)}s)
                                </h3>
                                <button onclick="copyToClipboard('unifiedScriptText_${i}')" class="text-xs ${mode === 'guardian' ? 'bg-purple-600 hover:bg-purple-500' : 'bg-cyan-600 hover:bg-cyan-500'} text-white font-semibold px-4 py-2 rounded-lg transition-colors shadow-lg">Copy Script</button>
                            </div>
                            <textarea id="unifiedScriptText_${i}" class="w-full bg-black/40 border ${mode === 'guardian' ? 'border-purple-500/20' : 'border-cyan-500/20'} text-green-400 text-sm h-[320px] p-4 rounded-xl font-mono focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all shadow-inner resize-y">${unifiedText}</textarea>
                        </div>
                    `;
                }

                containerHtml += `
                    <textarea id="fullScriptText" class="hidden">${fullDownloadText}</textarea>
                    <button onclick="downloadText('fullScriptText', 'Marskey_Master_Script_Full')" class="w-full py-4 text-sm bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2">
                        Download Semua Scene (.txt)
                    </button>
                </div>`;

                document.getElementById('outputContainer').innerHTML = containerHtml;
                btn.innerHTML = "JADIKAN KARYAMU";
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }, 800);
        }
    </script>
</body>
</html>
